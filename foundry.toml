[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
solc_version = "0.8.28"
optimizer = true
# Keep the router below EIP-170 after its authoritative oracle and SwapVM
# boundary checks. The direct settlement path is intentionally small, so this
# size-safe setting is preferable to removing financial validation.
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
