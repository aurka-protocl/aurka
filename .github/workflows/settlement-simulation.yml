name: Settlement simulation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settlement-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    name: Local direct settlement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check

      - name: Build local fixtures
        run: forge build --sizes

      - name: Run deterministic direct settlement
        run: forge test --match-contract AurkaSwapVMRouterTest -vvv

      - name: Check gas snapshot
        run: forge snapshot --check

# Live Aqua/SwapVM tests must be added as a separate manually approved job with
# explicit network and credential protection. This workflow never broadcasts.
